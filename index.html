<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <h1>Exemplos de Formulário em HTML</h1>
        <h2>Exemplo 1</h2>
        <input type="text" name="Nome" placeholder="Nome">
        <input type="text" name="E-mail" placeholder="E-mail">
        <input type="date" name="DataNascimento" placeholder="Data de Nascimento">
        <input type="tel" name="Celular" placeholder="Celular">
        <input type="password" name="Senha" placeholder="Senha">
        <input type="submit" name="Cadastrar" value="Cadastrar">
    </form>
    <h2>Exemplo 2</h2>
    <form>
        <textarea name="Texto livre" placeholder="Texto livre"></textarea>
    </form>
    <h2>Exemplo 3</h2>
    <fieldset>
        <legend>Formulário</legend>
        <form>
            Nome:<input type="text" name="Nome">
            <br><br>
            Sexo:
            <input type="radio" name="Sexo" value="Masculino"> Masculino
            <input type="radio" name="Sexo" value="Feminino"> Feminino
            <br><br>
            País:
            <select name="País">
                <option>Selecione uma opção</option>
                <option>Brasil</option>
                <option>Argentina</option>
                <option>Chile</option>
                <option>Uruguai</option>
            </select>
            <br><br>
            Mensagem:
            <br>
            <textarea name="Mensagem"></textarea>
            <br><br>
            <input type="checkbox" name="Assinar Newsletter?">
             Assinar Newsletter?
            <br><br>
            <input type="submit" name="Enviar" value="Enviar">
             </fieldset>
        </form>
            <h2>Exemplo 4</h2>
            <form>
                <input type="search">
                <input type="submit" value="Clique para Pesquisar">
            </form>
</body>

</html>
